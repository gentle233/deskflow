name: Build DeskFlow EXE + Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller (One-Dir)
        run: pyinstaller build.spec

      - name: Verify EXE
        run: |
          if (Test-Path "dist/DeskFlow/DeskFlow.exe") {
            $folder = Get-ChildItem "dist/DeskFlow"
            $total = ($folder | Measure-Object Length -Sum).Sum / 1MB
            $files = ($folder | Measure-Object).Count
            Write-Host "✅ 构建成功 — $files 个文件, 合计 $([math]::Round($total, 1)) MB"
            Write-Host "   exe: $( (Get-Item 'dist/DeskFlow/DeskFlow.exe').Length / 1KB ) KB"
          } else {
            Write-Error "❌ dist/DeskFlow/DeskFlow.exe 不存在"
            exit 1
          }

      # ── Compile Installer via Inno Setup ──
      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      - name: Verify Installer
        run: |
          if (Test-Path "installer/DeskFlow-Setup-*.exe") {
            $setup = Get-ChildItem "installer/DeskFlow-Setup-*.exe"
            $size = $setup.Length / 1MB
            Write-Host "✅ 安装包构建成功 — $([math]::Round($size, 1)) MB"
            Write-Host "   $($setup.Name)"
          } else {
            Write-Error "❌ 安装包不存在"
            exit 1
          }

      # ── Upload Artifacts ──
      - name: Upload Portable (zip)
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Portable
          path: dist/DeskFlow/

      - name: Upload Installer (exe)
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Setup
          path: installer/DeskFlow-Setup-*.exe

      # ── Release (tag push only) ──
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/DeskFlow-Setup-*.exe
            dist/DeskFlow/**
          generate_release_notes: true
          fail_on_unmatched_files: false
