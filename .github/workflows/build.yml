name: Build DeskFlow EXE + Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (可选)'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (One-Dir)
        run: |
          pyinstaller `
            --onedir `
            --collect-all flask `
            --collect-all jinja2 `
            --collect-all werkzeug `
            --collect-all markupsafe `
            --collect-all pandas `
            --collect-all openpyxl `
            --collect-all apscheduler `
            --collect-all watchdog `
            --collect-all pywinauto `
            --hidden-import core.config `
            --hidden-import core.llm_gateway `
            --hidden-import core.file_ops `
            --hidden-import core.shortcuts `
            --hidden-import core.logger `
            --hidden-import core.file_monitor `
            --hidden-import core.task_scheduler `
            --hidden-import core.provider_tester `
            --hidden-import agents.base_agent `
            --hidden-import agents.file_manager `
            --hidden-import agents.document `
            --hidden-import agents.excel `
            --hidden-import agents.web_search `
            --hidden-import agents.memory `
            --hidden-import agents.window_ops `
            --hidden-import orchestrator.engine `
            --hidden-import orchestrator.intent_router `
            --hidden-import orchestrator.workflows `
            --hidden-import orchestrator.scheduler `
            --hidden-import autolearn.models `
            --hidden-import autolearn.collector `
            --hidden-import autolearn.analyzer `
            --hidden-import autolearn.hooks `
            --hidden-import memory.store `
            --hidden-import memory.profile `
            --hidden-import memory.learner `
            --hidden-import apscheduler.triggers.cron `
            --hidden-import apscheduler.triggers.interval `
            --hidden-import apscheduler.schedulers.background `
            --hidden-import pyperclip `
            --hidden-import win32gui `
            --hidden-import webview `
            --add-data "ui/templates;ui/templates" `
            --add-data "ui/static;ui/static" `
            --add-data "ui/icons;ui/icons" `
            --icon ui/icons/deskflow.ico `
            --name DeskFlow `
            --noconsole `
            run.py

      - name: Verify EXE
        run: |
          if (Test-Path "dist/DeskFlow/DeskFlow.exe") {
            $folder = Get-ChildItem "dist/DeskFlow"
            $total = ($folder | Measure-Object Length -Sum).Sum / 1MB
            $files = ($folder | Measure-Object).Count
            Write-Host "✅ 构建成功 — $files 个文件, 合计 $([math]::Round($total, 1)) MB"
          } else {
            Write-Error "❌ dist/DeskFlow/DeskFlow.exe 不存在"
            exit 1
          }

      - name: Check Flask in bundle
        run: |
          $flaskDir = "dist/DeskFlow/flask"
          if (Test-Path $flaskDir) {
            Write-Host "✅ flask 已打包"
          } else {
            Write-Error "❌ flask 未打包！查找 fla*..."
            Get-ChildItem "dist/DeskFlow" -Filter "fla*" | ForEach-Object { Write-Host "  找到: $_" }
            if (-not (Get-ChildItem "dist/DeskFlow" -Filter "fla*")) {
              Write-Host "  搜索全部 .pth / .py 文件..."
              Get-ChildItem "dist/DeskFlow" -Filter "*.pth" | ForEach-Object { Write-Host "  .pth: $_" }
            }
            exit 1
          }

      - name: Build Installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss
            Write-Host "✅ 安装包构建成功"
          } else {
            Write-Host "⚠ Inno Setup 未安装，跳过安装包"
          }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Portable
          path: dist/DeskFlow/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Setup
          path: installer/*.exe

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeskFlow/**
            installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
