name: Build DeskFlow EXE + Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (可选)'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with SPEC
        run: pyinstaller build.spec

      - name: Verify EXE
        run: |
          if (Test-Path "dist/DeskFlow/DeskFlow.exe") {
            $items = Get-ChildItem "dist/DeskFlow" -Directory
            $totalSize = (Get-ChildItem "dist/DeskFlow" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            Write-Host "✅ 构建成功 — $(Get-ChildItem 'dist/DeskFlow' -Recurse -File | Measure-Object).Count 个文件"
            Write-Host "   合计 $([math]::Round($totalSize, 1)) MB"
            $items | ForEach-Object { Write-Host "   📁 $_" }
          } else {
            Write-Error "dist/DeskFlow/DeskFlow.exe 不存在"
            Get-ChildItem "dist" -Recurse -Depth 1
            exit 1
          }

      - name: Build Installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss | Write-Host
            Write-Host "✅ 安装包构建成功"
          } else {
            Write-Host "⚠ Inno Setup 未安装，跳过"
          }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Portable
          path: dist/DeskFlow/

      - name: Upload Installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-${{ github.event.inputs.version || github.ref_name }}-Setup
          path: installer/*.exe

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeskFlow/**
            installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
