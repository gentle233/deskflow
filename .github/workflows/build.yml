name: Build DeskFlow EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (可选)'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller build.spec

      - name: Verify EXE
        run: |
          if (Test-Path "dist/DeskFlow.exe") {
            $size = (Get-Item "dist/DeskFlow.exe").Length / 1MB
            Write-Host "✅ EXE 构建成功 — 大小: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "❌ dist/DeskFlow.exe 不存在"
            exit 1
          }

      - name: Upload Artifact (workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-Windows-${{ github.event.inputs.version || github.ref_name }}
          path: dist/DeskFlow.exe
          compression-level: 0

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskFlow.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
