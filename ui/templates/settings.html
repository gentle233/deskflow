<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeskFlow - 配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5; height: 100vh; overflow: hidden;
        }
        #app {
            max-width: 800px; margin: 0 auto; background: #fff;
            height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        #header {
            display: flex; align-items: center; padding: 12px 20px;
            border-bottom: 1px solid #eee; gap: 12px;
        }
        #header h2 { font-size: 16px; font-weight: 600; color: #333; flex: 1; }
        .back-btn {
            text-decoration: none; color: #4a7cff; font-size: 14px;
            padding: 4px 12px; border: 1px solid #4a7cff; border-radius: 6px;
        }
        .content { padding: 24px 20px; }
        .section { margin-bottom: 24px; }
        .section h3 { font-size: 14px; color: #999; margin-bottom: 12px; }
        .card {
            background: #fafafa; border-radius: 8px; padding: 16px;
            border: 1px solid #eee;
        }
        .row {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .row .label { color: #666; }
        .row .value { color: #333; font-weight: 500; }
        .status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 12px; font-weight: 500;
        }
        .status-ok { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .status-err { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
        .status-wait { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
        .reconfig-btn {
            display: block; width: 100%; padding: 12px;
            background: #4a7cff; color: #fff; border: none;
            border-radius: 8px; font-size: 14px; cursor: pointer;
            margin-top: 16px; text-align: center;
        }
        .reconfig-btn:hover { background: #3a66d9; }
        #check-result { margin-top: 12px; font-size: 13px; }
        /* 日志查看器 */
        .log-viewer {
            background: #1e1e2e; color: #cdd6f4; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px; line-height: 1.6; padding: 12px; border-radius: 8px;
            max-height: 400px; overflow-y: auto; white-space: pre; margin: 0;
            border: 1px solid #313244; tab-size: 2;
        }
        .log-viewer::-webkit-scrollbar { width: 6px; }
        .log-viewer::-webkit-scrollbar-track { background: #181825; }
        .log-viewer::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
        .log-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
        }
        .log-tabs { display: flex; gap: 4px; }
        .log-tab {
            padding: 4px 12px; border: 1px solid #ddd; border-radius: 6px;
            background: #f5f5f5; cursor: pointer; font-size: 12px; color: #666;
            transition: all 0.15s;
        }
        .log-tab:hover { background: #e8f0ff; border-color: #4a7cff; }
        .log-tab.active {
            background: #4a7cff; color: #fff; border-color: #4a7cff;
        }
        .log-actions {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .log-actions input[type="text"] {
            padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 12px; width: 120px;
        }
        .log-actions select {
            padding: 4px 6px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 12px; background: #fff;
        }
        .log-actions button {
            padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px;
            background: #fff; cursor: pointer; font-size: 13px;
        }
        .log-actions button:hover { background: #f0f0f0; }
        .log-status {
            font-size: 11px; color: #999; padding: 4px 0; text-align: right;
        }
        .log-line-error { color: #f38ba8; }
        .log-line-warning { color: #fab387; }
        .log-line-info { color: #89b4fa; }
        .log-line-other { color: #6c7086; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <a href="/" class="back-btn">← 回到聊天</a>
            <h2>设置与配置</h2>
        </div>
        <div class="content">
            <div class="section">
                <h3>AI 提供商</h3>
                <div class="card" id="config-card">
                    <div class="row"><span class="label">提供商</span><span class="value" id="provider">-</span></div>
                    <div class="row"><span class="label">模型</span><span class="value" id="model">-</span></div>
                    <div class="row"><span class="label">API Key</span><span class="value" id="api-key">-</span></div>
                </div>
                <button class="reconfig-btn" onclick="location.href='/'">重新配置</button>
            </div>

            
            <div class="section">
                <h3>搜索设置</h3>
                <div class="card">
                    <div class="row">
                        <span class="label">搜索提供商</span>
                        <select id="search-provider" onchange="toggleBingKey()">
                            <option value="ddgs">DuckDuckGo（无需配置）</option>
                            <option value="bing">必应搜索 API（需 Key）</option>
                        </select>
                    </div>
                    <div id="bing-key-row" class="row" style="display:none">
                        <span class="label">必应 API Key</span>
                        <input type="password" id="bing-key" placeholder="输入必应 API Key" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--ibg);color:var(--text)">
                    </div>
                    <div class="row">
                        <button class="reconfig-btn" onclick="saveSearchConfig()">保存搜索设置</button>
                    </div>
                    <div id="search-result" style="font-size:12px;color:var(--t3);padding:4px 0"></div>
                </div>
            </div>

            <div class="section">
                <h3>快捷指令</h3>
                <div class="card">
                    <div id="shortcut-list"></div>
                    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
                        <input id="sc-trigger" placeholder="/前缀" style="flex:1;min-width:80px;padding:8px;border:1px solid #ddd;border-radius:6px">
                        <input id="sc-command" placeholder="触发后发送的内容" style="flex:2;min-width:150px;padding:8px;border:1px solid #ddd;border-radius:6px">
                        <button onclick="addShortcut()" style="padding:8px 16px;background:#4a7cff;color:#fff;border:none;border-radius:6px;cursor:pointer">添加</button>
                    </div>
                    <div id="sc-msg" style="font-size:12px;color:#999;padding:4px 0"></div>
                </div>
            </div>

            <div class="section">
                <h3>连接检查</h3>
                <div class="card">
                    <div class="row">
                        <span class="label">API 状态</span>
                        <span id="status-badge" class="status-badge status-wait">检查中...</span>
                    </div>
                    <div id="check-result"></div>
                </div>
            </div>

            <div class="section">
                <h3>功能状态</h3>
                <div class="card" id="features-card">
                    <div class="row"><span class="label">聊天对话</span><span class="value">✔ 已实现</span></div>
                    <div class="row"><span class="label">文件查找</span><span class="value">✔ 已实现</span></div>
                    <div class="row"><span class="label">文档读取/生成</span><span class="value">✔ 已实现</span></div>
                    <div class="row"><span class="label">Excel 分析</span><span class="value">✔ 已实现</span></div>
                    <div class="row"><span class="label">联网搜索</span><span class="value">⚠ 服务器可能受限</span></div>
                    <div class="row"><span class="label">用户习惯学习</span><span class="value">❌ 尚未实现</span></div>
                    <div class="row"><span class="label">邮件处理</span><span class="value">❌ 未实现</span></div>
                    <div class="row"><span class="label">自动化任务</span><span class="value">❌ 未实现</span></div>
                    <div class="row">
                        <span class="label">提示音</span>
                        <label><input type="checkbox" id="sound-toggle" checked onchange="localStorage.setItem('deskflow_sound', this.checked ? 'on' : 'off')"> 消息提醒音</label>
                    </div>
                    <div class="row">
                        <span class="label">自动学习</span>
                        <span class="value" id="autolearn-stats">加载中...</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>错误日志</h3>
                <div class="card" id="log-card">
                    <div class="log-toolbar">
                        <div class="log-tabs">
                            <button class="log-tab active" data-level="" onclick="switchLogLevel(this, '')">全部</button>
                            <button class="log-tab" data-level="INFO" onclick="switchLogLevel(this, 'INFO')">INFO</button>
                            <button class="log-tab" data-level="WARNING" onclick="switchLogLevel(this, 'WARNING')">WARN</button>
                            <button class="log-tab" data-level="ERROR" onclick="switchLogLevel(this, 'ERROR')">ERROR</button>
                        </div>
                        <div class="log-actions">
                            <input id="log-search" type="text" placeholder="搜索..." oninput="loadLogsDelayed()">
                            <select id="log-lines" onchange="loadLogs()">
                                <option value="100">100行</option>
                                <option value="200" selected>200行</option>
                                <option value="500">500行</option>
                                <option value="1000">1000行</option>
                            </select>
                            <button onclick="loadLogs()" title="刷新">🔄</button>
                            <button onclick="scrollLogBottom()" title="到底">⬇</button>
                            <button onclick="confirmClearLogs()" title="清空" style="color:#ff4d4f">🗑</button>
                            <label style="font-size:12px;color:#888;display:flex;align-items:center;gap:4px">
                                <input type="checkbox" id="log-auto" checked onchange="toggleAutoRefresh()"> 自动
                            </label>
                        </div>
                    </div>
                    <pre id="log-viewer" class="log-viewer">加载中...</pre>
                    <div id="log-status" class="log-status"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function loadConfig() {
            const r = await fetch('/api/config');
            const config = await r.json();
            document.getElementById('provider').textContent = config.provider || '-';
            document.getElementById('model').textContent = config.model || '自动';
            document.getElementById('api-key').textContent = config.api_key || '未设置';
        }
        async function checkConnection() {
            const badge = document.getElementById('status-badge');
            const result = document.getElementById('check-result');
            try {
                const r = await fetch('/api/provider/check');
                const data = await r.json();
                if (data.status === 'ok') {
                    badge.className = 'status-badge status-ok';
                    badge.textContent = '✔ 正常';
                } else {
                    badge.className = 'status-badge status-err';
                    badge.textContent = '✘ 失败';
                    result.textContent = data.message;
                }
            } catch(e) {
                badge.className = 'status-badge status-err';
                badge.textContent = '✘ 连接失败';
            }
        }
        loadConfig();
        checkConnection();
    </script>

<script>
async function loadShortcuts() {
    const r = await fetch('/api/shortcuts');
    const list = await r.json();
    const el = document.getElementById('shortcut-list');
    if (!el) return;
    el.innerHTML = list.map(s => `
        <div class="row">
            <span><code style="background:#f0f0f0;padding:2px 6px;border-radius:4px">${escHtml(s.trigger)}</code>
            <span style="color:#666;margin-left:8px">${escHtml(s.desc || s.command.slice(0, 20))}</span></span>
            <button onclick="deleteShortcut('${escHtml(s.trigger)}')" style="border:none;background:none;color:#ff4d4f;cursor:pointer;font-size:13px">✕</button>
        </div>
    `).join('');
}
async function addShortcut() {
    const t = document.getElementById('sc-trigger').value.trim();
    const c = document.getElementById('sc-command').value.trim();
    const msg = document.getElementById('sc-msg');
    if (!t || !c) { msg.textContent = '请填写触发词和内容'; return; }
    const r = await fetch('/api/shortcuts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trigger:t, command:c})});
    const data = await r.json();
    if (data.status === 'ok') {
        msg.textContent = '✅ 已添加';
        document.getElementById('sc-trigger').value = '';
        document.getElementById('sc-command').value = '';
        loadShortcuts();
    } else {
        msg.textContent = '❌ ' + (data.error || '添加失败');
    }
}
async function deleteShortcut(trigger) {
    await fetch('/api/shortcuts', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trigger:trigger})});
    loadShortcuts();
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadSearchConfig() {
    try {
        const r = await fetch('/api/config');
        const cfg = await r.json();
        const sel = document.getElementById('search-provider');
        if (sel) sel.value = cfg.search_provider || 'ddgs';
        if (cfg.bing_api_key) {
            const keyInput = document.getElementById('bing-key');
            if (keyInput) keyInput.value = '••••••••' + cfg.bing_api_key.slice(-4);
        }
        toggleBingKey();
    } catch(e) {}
}
function toggleBingKey() {
    const show = document.getElementById('search-provider')?.value === 'bing';
    const row = document.getElementById('bing-key-row');
    if (row) row.style.display = show ? 'flex' : 'none';
}
async function saveSearchConfig() {
    const provider = document.getElementById('search-provider')?.value;
    const key = document.getElementById('bing-key')?.value;
    const result = document.getElementById('search-result');
    if (!result) return;
    try {
        const r = await fetch('/api/config/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({search_provider: provider, bing_api_key: key?.includes('*') ? '' : key})
        });
        const data = await r.json();
        result.textContent = data.status === 'ok' ? '✅ 已保存' : '❌ ' + (data.error || '保存失败');
    } catch(e) {
        result.textContent = '❌ ' + e.message;
    }
}

loadSearchConfig();
loadShortcuts();

// 日志查看器
let logLevel = '';
let logTimer = null;
let logAutoRefresh = true;

async function loadLogs() {
    const viewer = document.getElementById('log-viewer');
    const status = document.getElementById('log-status');
    if (!viewer) return;
    const lines = document.getElementById('log-lines')?.value || 200;
    const search = document.getElementById('log-search')?.value || '';
    const url = `/api/logs?lines=${lines}&level=${logLevel}&search=${encodeURIComponent(search)}`;
    try {
        viewer.textContent = '加载中...';
        const r = await fetch(url);
        const data = await r.json();
        if (data.lines.length === 0) {
            viewer.innerHTML = '<span style="color:#6c7086">暂无日志</span>';
        } else {
            // 按级别着色
            viewer.innerHTML = data.lines.map(line => {
                if (line.includes('[ERROR]')) return `<span class="log-line-error">${escHtml(line)}</span>`;
                if (line.includes('[WARNING]')) return `<span class="log-line-warning">${escHtml(line)}</span>`;
                if (line.includes('[INFO]')) return `<span class="log-line-info">${escHtml(line)}</span>`;
                return `<span class="log-line-other">${escHtml(line)}</span>`;
            }).join('\n');
        }
        status.textContent = `共 ${data.total_lines} 行 · 显示 ${data.filtered_lines} 行 · ${data.file_size_mb} MB`;
        viewer.scrollTop = viewer.scrollHeight;
    } catch(e) {
        viewer.textContent = '❌ 加载失败: ' + e.message;
    }
}

function loadLogsDelayed() {
    clearTimeout(logTimer);
    logTimer = setTimeout(loadLogs, 300);
}

function switchLogLevel(btn, level) {
    document.querySelectorAll('.log-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    logLevel = level;
    loadLogs();
}

function scrollLogBottom() {
    const viewer = document.getElementById('log-viewer');
    if (viewer) viewer.scrollTop = viewer.scrollHeight;
}

function toggleAutoRefresh() {
    logAutoRefresh = document.getElementById('log-auto')?.checked || false;
    if (logAutoRefresh) loadLogs();
}

function confirmClearLogs() {
    if (!confirm('确定要清空所有日志吗？')) return;
    if (!confirm('⚠️ 此操作不可撤销，确认清空？')) return;
    fetch('/api/logs/clear', {method:'POST'}).then(r => r.json()).then(d => {
        if (d.status === 'ok') {
            loadLogs();
        } else {
            alert('清空失败: ' + (d.error || ''));
        }
    });
}

// 自动刷新：每 15 秒
setInterval(() => {
    if (logAutoRefresh) loadLogs();
}, 15000);

// 加载日志
loadLogs();

// 恢复提示音开关状态
const soundToggle = document.getElementById('sound-toggle');
if (soundToggle) soundToggle.checked = localStorage.getItem('deskflow_sound') !== 'off';
// 加载自动学习统计
fetch('/api/autolearn/stats').then(r=>r.json()).then(d=>{
    const el = document.getElementById('autolearn-stats');
    if (el) el.textContent = `📊 今日${d.events_today}条事件 · ${d.active_patterns}条模式 · ${d.storage_mb}MB`;
}).catch(()=>{});
</script>

</body>
</html>
